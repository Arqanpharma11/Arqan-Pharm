name: Arqan one-shot missing photo batch
on:
  push:
    branches: [main]
    paths: ['data/arkan-one-shot-missing-20261126.csv']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arkan-image-agent
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_THREAD_LIMIT: '1'
      ARKAN_ASSET_PUBLISH_BUDGET: '250'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing bilingual matcher dependencies
        run: |
          python -m pip install --quiet 'ddgs>=9,<12' 'requests>=2.31,<3' 'Pillow>=10,<13' 'pytesseract>=0.3.10,<1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr-eng tesseract-ocr-ara
      - name: Test matching and publication guardrails
        run: |
          python scripts/test_product_images_v2.py
          node scripts/test_arkan_publish_matched_assets.cjs
      - name: Search entire fixed missing-ID batch with OCR
        run: |
          python scripts/product_images_v2.py --csv data/arkan-one-shot-missing-20261126.csv --en-col name_en --storefront-index data/arkan-image-candidate-review.json --workers 12 --ocr --repo .
      - name: Stage all high-confidence results, without intermediate pushes
        run: |
          for i in 1 2 3; do
            node scripts/arkan-publish-matched-assets.cjs
            cp data/arkan-asset-publication-report.json "/tmp/arkan-batch-$i.json"
          done
          python - <<'PY'
          import csv,json,collections
          from pathlib import Path
          with open('data/arkan-one-shot-missing-20261126.csv',encoding='utf-8-sig') as f:
              target=list(csv.DictReader(f))
          with open('results_v2.csv',encoding='utf-8-sig') as f:
              results=list(csv.DictReader(f))
          ids=sorted({str(i) for p in Path('/tmp').glob('arkan-batch-*.json') for i in json.loads(p.read_text())['ids']},key=int)
          report={'targeted':len(target),'searched':len(results),'search_status':dict(collections.Counter(r['status'] for r in results)),'new_photo_count':len(ids),'new_photo_ids':ids,'note':'Only accepted photos; not a claim of visual verification or live deployment.'}
          Path('data/arkan-one-shot-publication-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - name: Verify assets before one publication commit
        run: |
          node scripts/check_arkan_asset_publication.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/product-images/ data/arkan-auto-published-images.json data/arkan-asset-publication-report.json data/arkan-one-shot-publication-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish accepted missing-product photos in one batch"
            git pull --rebase origin main
            node scripts/check_arkan_asset_publication.cjs
            git push origin HEAD:main
          fi
          cat data/arkan-one-shot-publication-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain uncertain results separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arqan-one-shot-photo-results
          path: |
            results_v2.csv
            review.html
            review_images/
            data/arkan-one-shot-publication-report.json
          if-no-files-found: ignore
          retention-days: 7
