name: Publish Arkan trial image previews
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/arkan-trial-photo-feed.cjs'
      - 'scripts/arkan-trial-photo-feed.test.cjs'
      - 'data/arkan-trial-image-config.json'
      - '.github/workflows/arkan-trial-publish.yml'
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
permissions:
  contents: write
concurrency:
  group: arkan-trial-photo-publish
  cancel-in-progress: false
jobs:
  publish-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build trial images independent of the OCR workflow
        run: |
          node --check scripts/arkan-trial-photo-feed.cjs
          node scripts/arkan-trial-photo-feed.cjs
          node scripts/arkan-trial-photo-feed.test.cjs
      - name: Publish with safe regeneration on concurrent repository changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Recalculate from the newest repository state on every attempt:
            # never resolve a conflicting JSON photo feed by overwriting another run.
            git fetch origin main
            git reset --hard origin/main
            node scripts/arkan-trial-photo-feed.cjs
            node scripts/arkan-trial-photo-feed.test.cjs
            git add data/arkan-trial-photo-feed.json
            if git diff --cached --quiet; then
              echo "Trial preview already up to date"
              exit 0
            fi
            git commit -m "chore: publish updated trial image thumbnails"
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::Remote changed during trial publish; rebuilding from latest source (attempt $attempt)"
          done
          echo "::error::Unable to publish trial preview after three fresh rebuilds"
          exit 1
