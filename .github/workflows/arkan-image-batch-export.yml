name: Export exact 4489 product image batches
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/arkan-image-batch-import.cjs'
      - '.github/workflows/arkan-image-batch-export.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and export
        run: |
          node --check scripts/arkan-image-batch-import.cjs
          node scripts/arkan-image-batch-import.cjs
          node -e "const i=require('./data/image-batches/index.json'); if(i.catalogTotal!==4489||i.files.length!==45) throw Error('Invalid export'); console.log(i.coverage)"
          git diff --exit-code -- index.html data/arkan-auto-published-images.json
      - uses: actions/upload-artifact@v4
        with:
          name: arqan-4489-image-batches
          path: data/image-batches/
          if-no-files-found: error
          retention-days: 14
