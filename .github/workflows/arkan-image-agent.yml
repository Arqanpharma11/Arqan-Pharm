name: Arkan Auto Image Agent
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/arkan-image-agent.cjs'
      - 'scripts/arkan-auto-publish.cjs'
      - 'scripts/arkan-auto-publish.test.cjs'
      - 'scripts/arkan-visual-publish.py'
      - 'scripts/check_pharmacy_image_integrity.py'
      - 'scripts/check_arkan_image_data.py'
      - 'scripts/check_portal_javascript.py'
      - 'scripts/arkan-trial-photo-feed.cjs'
      - 'scripts/arkan-trial-photo-feed.test.cjs'
      - 'data/arkan-trial-image-config.json'
      - 'trial-images.html'
      - '.github/workflows/arkan-image-agent.yml'
permissions:
  contents: write
concurrency:
  group: arkan-image-agent
  cancel-in-progress: false
jobs:
  audit-and-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify image seed consistency and portal syntax first
        run: |
          python scripts/check_pharmacy_image_integrity.py
          python scripts/check_portal_javascript.py
          python scripts/check_arkan_image_data.py
      - name: Test safe photo publication rules
        run: |
          node --check scripts/arkan-image-agent.cjs
          node --check scripts/arkan-auto-publish.cjs
          node --test scripts/arkan-auto-publish.test.cjs
      - name: Audit images and search permitted providers
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          IMAGE_CHECK_BUDGET: '30'
          IMAGE_SEARCH_BUDGET: '20'
        run: node scripts/arkan-image-agent.cjs
      - name: Prepare open-photo OCR verification when eligible records exist
        run: |
          if python -c "import json; x=json.load(open('data/arkan-auto-published-images.json')); exit(0 if x.get('byId') else 1)"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr-eng
            python -m pip install --quiet Pillow
          fi
      - name: Inspect actual packaging pixels and publish only independently supported matches
        env:
          VISUAL_PUBLISH_BUDGET: '10'
        run: |
          python -m py_compile scripts/arkan-visual-publish.py
          if python -c "import json; x=json.load(open('data/arkan-auto-published-images.json')); exit(0 if x.get('byId') else 1)"; then
            python scripts/arkan-visual-publish.py
            python scripts/check_pharmacy_image_integrity.py
            python scripts/check_portal_javascript.py
          fi
      - name: Always validate published image seeds and portal syntax
        run: |
          python scripts/check_pharmacy_image_integrity.py
          python scripts/check_portal_javascript.py
      - name: Validate final external-image catalog
        run: python scripts/check_arkan_image_data.py
      - name: Build complete image coverage and missing-product inventory
        run: node scripts/arkan-image-coverage.cjs
      - name: Publish with bounded safe retry on concurrent Git changes
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/product-images/ data/arkan-visual-publish-report.json data/arkan-visual-publish-state.json data/arkan-image-agent-state.json data/arkan-image-review-queue.json data/arkan-image-agent-report.json data/arkan-auto-published-images.json data/arkan-image-coverage.csv data/arkan-image-coverage-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update unattended image health and discovery queue"
          if git push origin HEAD:main; then exit 0; fi
          echo "::warning::Concurrent repository update detected; recomputing image state against the newest revision"
          # Rebuild rather than force-merge JSON state or overwrite verified images.
          # Newly eligible OCR photo(s) will be reconsidered by the next scheduled run.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            IMAGE_CHECK_BUDGET=5 IMAGE_SEARCH_BUDGET=4 node scripts/arkan-image-agent.cjs
            node scripts/arkan-image-coverage.cjs
            python scripts/check_pharmacy_image_integrity.py
            python scripts/check_portal_javascript.py
            git add data/arkan-image-agent-state.json data/arkan-image-review-queue.json data/arkan-image-agent-report.json data/arkan-auto-published-images.json data/arkan-image-coverage.csv data/arkan-image-coverage-report.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: persist retried image discovery state"
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::Image state publish race, rebuilding again (attempt $attempt)"
          done
          echo "::error::Unable to publish image state after three safe retries"
          exit 1
      - name: Upload diagnostics even when publishing is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkan-image-agent-diagnostics
          if-no-files-found: ignore
          path: |
            data/arkan-image-agent-report.json
            data/arkan-image-review-queue.json
            data/arkan-visual-publish-report.json
