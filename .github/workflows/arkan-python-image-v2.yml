name: Arkan bilingual Python image discovery
on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of uncovered products to search
        type: number
        default: 100
  push:
    paths:
      - 'scripts/product_images_v2.py'
      - 'scripts/test_product_images_v2.py'
      - 'scripts/arkan-v2-bridge.cjs'
      - 'scripts/test_arkan_publish_bridge.cjs'
      - 'scripts/arkan-visual-publish.py'
      - 'scripts/arkan-publish-matched-assets.cjs'
      - 'scripts/test_arkan_publish_matched_assets.cjs'
      - 'scripts/check_arkan_asset_publication.cjs'
      - '.github/workflows/arkan-python-image-v2.yml'
permissions:
  contents: write
concurrency:
  group: arkan-image-agent
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ARKAN_V2_BATCH_SIZE: ${{ inputs.batch_size || 100 }}
      ARKAN_ASSET_PUBLISH_BUDGET: ${{ inputs.batch_size || 100 }}
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and OCR for Arabic and English
        run: |
          python -m pip install --quiet 'ddgs>=9,<12' 'requests>=2.31,<3' 'Pillow>=10,<13' 'pytesseract>=0.3.10,<1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr-eng tesseract-ocr-ara
      - name: Test bilingual matching and syntax
        run: |
          python -m py_compile scripts/product_images_v2.py scripts/arkan-visual-publish.py
          python scripts/test_product_images_v2.py
          node --check scripts/arkan-v2-bridge.cjs
          node --check scripts/arkan-publish-matched-assets.cjs
          node scripts/test_arkan_publish_matched_assets.cjs
          node scripts/test_arkan_publish_bridge.cjs
          python scripts/check_portal_javascript.py
      - name: Prepare ID-matched Arabic and English image search
        run: node scripts/arkan-v2-bridge.cjs
      - name: Bounded background image search; no browser processing
        run: |
          python scripts/product_images_v2.py --csv data/arkan-v2-search-input.csv --en-col name_en --storefront-index data/arkan-image-candidate-review.json --workers 8 --ocr --repo .
      - name: Publish genuine matched WebP product thumbnails from discovery results
        run: node scripts/arkan-publish-matched-assets.cjs
      - name: Record fallback candidate links after asset publication
        run: node scripts/arkan-v2-bridge.cjs --ingest
      - name: Publish only independently OCR-verified packaging images
        env:
          VISUAL_PUBLISH_BUDGET: '10'
        run: |
          python scripts/arkan-visual-publish.py
          python scripts/check_pharmacy_image_integrity.py
          python scripts/check_portal_javascript.py
      - name: Verify image files and published manifest before commit
        run: node scripts/check_arkan_asset_publication.cjs
      - name: Commit small verified photo batches and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/product-images/ data/arkan-auto-published-images.json data/arkan-asset-publication-report.json data/arkan-visual-publish-report.json data/arkan-visual-publish-state.json data/arkan-v2-cursor.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bilingual image bot OCR results"
            git pull --rebase origin main
            node scripts/check_arkan_asset_publication.cjs
            python scripts/check_arkan_image_data.py
            git push origin HEAD:main
          fi
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const read = file => JSON.parse(fs.readFileSync(file, 'utf8'));
          const assets = read('data/arkan-asset-publication-report.json');
          const visual = read('data/arkan-visual-publish-report.json');
          const ids = new Set([...assets.ids, ...(visual.published_ids || []).map(String)]);
          console.log('### Arqan image bot');
          console.log('- Products with search results: ' + assets.processed);
          console.log('- New image records pushed to GitHub: ' + ids.size);
          console.log('- Rejected asset results: ' + JSON.stringify(assets.rejected));
          JS
      - name: Keep rejected and uncertain results outside storefront
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkan-bilingual-image-review
          retention-days: 7
          if-no-files-found: ignore
          path: |
            results_v2.csv
            review.html
            review_images/
