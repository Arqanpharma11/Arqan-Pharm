name: Mirror verified product images locally
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'scripts/mirror_product_images.py'
      - 'scripts/verified_image_replacements.json'
      - 'scripts/fix_image_seed_migration.py'
      - 'scripts/check_pharmacy_image_integrity.py'
      - 'scripts/check_portal_javascript.py'
      - 'scripts/smoke_portal_browser.mjs'
      - 'sw.js'
      - '.github/workflows/mirror-product-images.yml'
permissions:
  contents: write
concurrency:
  group: pharmacy-image-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoders
        run: python -m pip install 'Pillow>=11.2' pillow-avif-plugin
      - name: Check script syntax
        run: python -m py_compile scripts/mirror_product_images.py scripts/fix_image_seed_migration.py scripts/check_pharmacy_image_integrity.py scripts/check_portal_javascript.py
      - name: Process all currently sourced product photos in successive batches
        run: |
          set -e
          for batch in $(seq 1 8); do
            echo "Processing verified-source photo batch $batch / 8"
            python scripts/mirror_product_images.py
            python scripts/fix_image_seed_migration.py
            python scripts/check_pharmacy_image_integrity.py
            python scripts/check_portal_javascript.py
            node --check sw.js
            if python -c 'import json; r=json.load(open("image-mirror-report.json")); exit(0 if r.get("attempted", 0)==0 else 1)'; then
              echo "No further eligible verified-source images; stopping"
              break
            fi
          done
      - name: Install Chromium for portal responsiveness test
        if: github.event_name != 'schedule'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check desktop and mobile UI responsiveness
        if: github.event_name != 'schedule'
        run: node scripts/smoke_portal_browser.mjs
      - name: Commit successfully downloaded product images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/product-images/ image-mirror-report.json image-replacement-queue.csv scripts/image_legacy_source_map.json
          if test -f portal-smoke-report.json; then git add portal-smoke-report.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Host validated product image bytes locally to prevent broken hotlinks"
            git push
          fi
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-image-mirror-report
          path: |
            image-mirror-report.json
            image-replacement-queue.csv
            portal-smoke-report.json
            portal-smoke-desktop.png
            portal-smoke-mobile.png
