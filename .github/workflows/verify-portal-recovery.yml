name: Verify recovered Arqan portal
on:
  push:
    paths:
      - 'index.html'
      - 'docs/pdf-master-4489-2026-11-23.csv'
      - 'scripts/verify_pdf_master_catalog.cjs'
      - 'scripts/smoke_portal_browser.mjs'
      - '.github/workflows/verify-portal-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no duplicate image constants
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          count=page.count('const imageLegacySeedSources = ')
          assert count==1, f'Fatal duplicate JavaScript declarations: {count}'
          assert page.count('Object.entries(verifiedImageSeeds).forEach')==1
          print('PASS: image migration declarations unique')
          PY
      - name: Verify all 4489 PDF products and their prices and discounts
        run: node scripts/verify_pdf_master_catalog.cjs
      - name: Parse all inline app scripts and service worker
        run: |
          python scripts/check_portal_javascript.py
          node --check sw.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for real desktop and mobile responsiveness checks
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Smoke-test portal on desktop and mobile, including login-entry button
        run: node scripts/smoke_portal_browser.mjs
      - name: Upload responsiveness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkan-portal-responsiveness
          if-no-files-found: ignore
          path: |
            portal-smoke-report.json
            portal-smoke-desktop.png
            portal-smoke-mobile.png
