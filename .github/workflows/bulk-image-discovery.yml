name: Discover batch product photos for 4218 Arqan items
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
  push:
    paths:
      - 'scripts/bulk_pharmacy_image_discovery.py'
      - 'scripts/test_bulk_image_matcher.py'
      - 'scripts/enrich_image_search_aliases.py'
      - 'scripts/build_bulk_image_upload_file.py'
      - 'scripts/build_fast_catalog_images.py'
      - 'scripts/stage_image_approvals.py'
      - 'data/arkan-all-4218-image-manifest.json'
      - 'scripts/check_arkan_image_data.py'
      - '.github/workflows/bulk-image-discovery.yml'
permissions:
  contents: write
concurrency:
  group: arqan-bulk-image-discovery
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bulk matching rules and script syntax
        run: |
          python -m py_compile scripts/bulk_pharmacy_image_discovery.py scripts/test_bulk_image_matcher.py scripts/enrich_image_search_aliases.py scripts/build_bulk_image_upload_file.py scripts/build_fast_catalog_images.py scripts/stage_image_approvals.py
          python scripts/test_bulk_image_matcher.py
      - name: Expand missing search names from Egyptian CC0 medicine dataset
        run: python scripts/enrich_image_search_aliases.py
      - name: Collect public pharmacy product photo metadata in batches
        run: python scripts/bulk_pharmacy_image_discovery.py --max-pages 60 --delay 0.8
      - name: Update lightweight pharmacist image preview feed
        run: python scripts/build_fast_catalog_images.py
      - name: Validate unique image candidates and trial safety
        run: python scripts/check_arkan_image_data.py
      - name: Stage conservative metadata review with zero unverified approvals
        run: python scripts/stage_image_approvals.py
      - name: Generate one-file 4218-product admin upload template
        run: python scripts/build_bulk_image_upload_file.py
      - name: Save 4218-item image candidate review file to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arkan-quick-image-candidates.json data/arkan-image-candidate-review.json data/arkan-english-image-search-aliases.json data/arkan-4218-bulk-image-upload-template.json data/arkan-image-approval-worklist.json
          if ! git diff --cached --quiet; then
            git commit -m "Index public pharmacy image candidate links for Arqan 4218-item catalog"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload image matching review file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arqan-4218-image-candidate-review
          path: |
            data/arkan-quick-image-candidates.json
            data/arkan-image-candidate-review.json
            data/arkan-english-image-search-aliases.json
            data/arkan-4218-bulk-image-upload-template.json
            data/arkan-image-approval-worklist.json
