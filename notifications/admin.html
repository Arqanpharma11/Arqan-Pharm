<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة إشعارات أركان</title><style>body{font:16px system-ui;background:#f5efe6;color:#3e2723;margin:0;padding:24px}main{max-width:480px;margin:24px auto;background:white;padding:24px;border-radius:18px}label{display:block;margin-top:12px}input,textarea{font:inherit;box-sizing:border-box;width:100%;padding:10px;border:1px solid #d5c5b4;border-radius:8px}button{font:inherit;color:white;background:#166534;border:0;border-radius:8px;padding:12px;margin-top:14px;cursor:pointer}button:disabled{opacity:.5}a{color:#166534}img{width:64px}p{line-height:1.7}[hidden]{display:none!important}</style></head><body><main><img src="../arkan-logo.svg" alt="أركان فارم"><h1>إدارة الإشعارات</h1><p>لوحة مستقلة لإرسال الإشعارات للأجهزة المشتركة.</p><form id="login" method="post" onsubmit="event.preventDefault();"><label for="email">بريد الأدمن</label><input id="email" type="email" required autocomplete="username"><label for="password">كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"><button id="loginbtn" disabled>دخول</button></form><form id="send" hidden method="post" onsubmit="event.preventDefault();"><label for="title">عنوان الإشعار</label><input id="title" maxlength="100" required><label for="body">نص الإشعار</label><textarea id="body" maxlength="500" rows="4" required></textarea><button id="sendbtn">إرسال للجميع</button> <button type="button" id="logout">خروج</button></form><p id="status" role="status" aria-live="polite">جاري تجهيز الدخول…</p><a href="../index.html">العودة للمنصة</a></main><script src="./admin.js" defer></script></body></html>
