<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إشعارات أركان فارم</title><style>body{font:16px system-ui,sans-serif;background:#f5efe6;color:#3e2723;margin:0;padding:24px}main{max-width:480px;margin:30px auto;background:white;padding:24px;border-radius:18px}img{width:64px;height:64px}button,a{font:inherit}button{background:#166534;color:white;border:0;border-radius:10px;padding:12px;margin:6px 0;cursor:pointer}button:disabled{opacity:.5}textarea{width:100%;box-sizing:border-box;direction:ltr}p{line-height:1.7}a{color:#166534}</style></head><body><main><img src="../arkan-logo.svg" alt="أركان فارم"><h1>إشعارات العروض</h1><p>فعّل الإشعارات إذا رغبت في استقبال أخبار العروض وتوافر الأصناف. يمكنك إيقافها في أي وقت.</p><button id="enable">تفعيل الإشعارات</button> <button id="disable">إيقاف الإشعارات</button><p id="status" role="status" aria-live="polite"></p><section id="test" hidden><button id="copy">نسخ رمز الجهاز للاختبار</button><textarea id="token" readonly rows="4" aria-label="رمز الجهاز"></textarea><p>استخدم الرمز في Send test message داخل Firebase فقط، ولا تنشره علنًا.</p></section><p><a href="../index.html">العودة إلى أركان فارم</a></p></main><script src="./client.js" defer></script></body></html>
